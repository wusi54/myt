<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>投屏 - {{ name }}</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#000;display:flex;justify-content:center;align-items:center;min-height:100vh;flex-direction:column;color:#fff;font-family:sans-serif}
#screen{width:100%;max-width:480px;border-radius:4px;background:#111}
#status{padding:12px;font-size:14px;color:#8899aa}
.controls{position:fixed;top:12px;right:12px;z-index:10}
.btn{padding:8px 16px;background:#c42b1c;color:#fff;border:none;border-radius:4px;cursor:pointer;font-size:13px}
.toolbar{display:flex;gap:8px;padding:12px;flex-wrap:wrap;justify-content:center}
.tbtn{padding:8px 16px;background:#1a2a3a;color:#cfe3f5;border:1px solid #2a3a4a;border-radius:4px;cursor:pointer;font-size:13px}
.tbtn:hover{background:#243a4f;color:#00d4ff}
</style>
</head>
<body>
<div class="controls"><button class="btn" onclick="window.close()">关闭</button></div>
<video id="screen" autoplay playsinline muted></video>
<div id="status">连接中...</div>
<div class="toolbar">
  <button class="tbtn" onclick="sendKey(4)">← 返回</button>
  <button class="tbtn" onclick="sendKey(3)">● 主页</button>
  <button class="tbtn" onclick="sendKey(187)">■ 最近</button>
  <button class="tbtn" onclick="sendKey(26)">⏻ 电源</button>
  <button class="tbtn" onclick="sendText()">⌨ 输入</button>
</div>
<script>
const adbAddr = '{{ adb_addr }}';
const video = document.getElementById('screen');
const statusEl = document.getElementById('status');

function streamName(a){ return 'dev_' + String(a).replace(/\./g,'_').replace(/:/g,'_').replace(/-/g,'_'); }
const sname = streamName(adbAddr);
// MediaMTX WebRTC (WHEP) 走同源反向代理 /mtx，避免 HTTPS 页面加载 http://host:8889 被浏览器按混合内容拦截。
// nginx: /mtx/<stream>/whep -> mediamtx:8889/<stream>/whep
const mediamtxBase = '/mtx';
const whepUrl = mediamtxBase + '/' + sname + '/whep';
console.log('WHEP url:', whepUrl);

let lastEnsure = 0;
async function ensureAgent(){
  const now = Date.now();
  if (now - lastEnsure < 30000) return;
  lastEnsure = now;
  try{
    await fetch('/api/screen/ensure', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({adb_addr: adbAddr})
    });
  }catch(e){ console.warn('ensure agent failed', e); }
}

// ===== 屏幕操作（触控/按键/输入）=====
async function sendTouch(action, params){
  try{
    const r = await fetch('/api/screen/touch', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify(Object.assign({adb_addr:adbAddr, action:action}, params||{}))
    });
    if(!r.ok) toast('控制失败: '+r.status, 'error');
  }catch(e){ console.error('touch error', e); }
}
function sendKey(code){ sendTouch('key', {keycode:code}); }
function sendText(){ const t = prompt('输入文字发送到设备:'); if(t) sendTouch('text', {text:t}); }

let downPt = null;
video.addEventListener('pointerdown', (e)=>{ downPt = {x:e.clientX, y:e.clientY, t:Date.now()}; try{ video.setPointerCapture(e.pointerId);}catch(_){} e.preventDefault(); });
video.addEventListener('pointerup', (e)=>{
  if(!downPt) return;
  const start = downPt; downPt = null;
  const dist = Math.hypot(e.clientX-start.x, e.clientY-start.y);
  const rect = video.getBoundingClientRect();
  const bw = video.videoWidth || 1, bh = video.videoHeight || 1;
  const k = Math.min(rect.width/bw, rect.height/bh);
  const dw = bw*k, dh = bh*k, ox=(rect.width-dw)/2, oy=(rect.height-dh)/2;
  const nx0=(start.x-rect.left-ox)/dw, ny0=(start.y-rect.top-oy)/dh;
  if(nx0<0||nx0>1||ny0<0||ny0>1) return;
  if(dist < 8 && (Date.now()-start.t) < 500){
    sendTouch('tap', {nx:nx0, ny:ny0});
  } else {
    const nx1=(e.clientX-rect.left-ox)/dw, ny1=(e.clientY-rect.top-oy)/dh;
    if(nx1<0||nx1>1||ny1<0||ny1>1) return;
    sendTouch('swipe', {nx:nx0, ny:ny0, nx2:nx1, ny2:ny1, duration:Math.max(100, Math.min(800, Math.round(dist/2)))});
  }
});
video.addEventListener('pointercancel', ()=>{ downPt = null; });

// ===== WebRTC WHEP 播放 =====
let pc = null;
async function startWhep(){
  statusEl.textContent = '连接中 (WebRTC)...';
  await ensureAgent();
  try {
    pc = new RTCPeerConnection({ iceServers: [] });
    pc.addTransceiver('video', { direction: 'recvonly' });
    pc.ontrack = (e) => {
      video.srcObject = e.streams[0];
      // 显式调用 play()，确保浏览器自动播放（autoplay 属性可能被策略阻止）
      video.play().catch((err) => { console.warn('autoplay blocked:', err); });
      statusEl.textContent = '已连接（可触控操作）';
    };
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    // wait for ICE gathering (with timeout)
    await new Promise((resolve) => {
      if (pc.iceGatheringState === 'complete') { resolve(); return; }
      const t = setTimeout(resolve, 1500);
      pc.onicegatheringstatechange = () => {
        if (pc.iceGatheringState === 'complete') { clearTimeout(t); resolve(); }
      };
    });
    const res = await fetch(whepUrl, {
      method: 'POST',
      headers: { 'Content-Type': 'application/sdp' },
      body: pc.localDescription.sdp
    });
    if (!res.ok) {
      const txt = await res.text();
      throw new Error('WHEP ' + res.status + ': ' + txt.slice(0,200));
    }
    const answerSdp = await res.text();
    await pc.setRemoteDescription({ type: 'answer', sdp: answerSdp });
    // read Location for teardown (optional)
    const loc = res.headers.get('Location');
    console.log('WHEP connected, location:', loc);
  } catch (e) {
    console.error('WHEP error:', e);
    statusEl.textContent = 'WebRTC 连接失败: ' + e.message;
    if (pc) { try { pc.close(); } catch(_){} pc = null; }
    setTimeout(startWhep, 5000);
  }
}

startWhep();
</script>
</body>
</html>
