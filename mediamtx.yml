# MediaMTX minimal config for myt RTP+WebRTC
# Allow anonymous publish and playback

# RTSP
rtsp: yes
rtspAddress: :8554

# WebRTC
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcICEServers2: []

# Timeouts (increase for stability)
readTimeout: 60s
writeTimeout: 60s

# Paths (allow all)
paths:
  all:

# Logging
logLevel: info
logDestinations: [stdout]