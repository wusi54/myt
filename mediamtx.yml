# MediaMTX minimal config for myt RTP+WebRTC
# Allow anonymous publish and playback

# RTSP
rtsp: yes
rtspAddress: :8554

# SRT
srt: yes
srtAddress: :8890

# WebRTC
webrtc: yes
webrtcAddress: :8889
webrtcAllowOrigins: ["*"]
webrtcLocalUDPAddress: :8189
webrtcAdditionalHosts: [127.0.0.1, 113.105.100.58, 192.168.2.30]
webrtcICEServers2: []

# Timeouts (very high for stability)
readTimeout: 10m
writeTimeout: 10m

# Paths (allow all)
paths:
  all:

# Logging
logLevel: debug
logDestinations: [stdout]