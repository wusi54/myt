worker_processes  1;

events {
    worker_connections  1024;
}

http {
    # 真机参数文件单个可达数百 KB，批量导入多个时很容易超过 nginx 默认 1MB
    # （超限会直接 413，后端 MAX_CONTENT_LENGTH 根本没机会生效）
    client_max_body_size 512m;

    # WebSocket 长连接优化
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Docker 内嵌 DNS：让 nginx 动态解析后端服务名，
    # 避免 relay/web 重启后 IP 变化导致 nginx 仍转发到旧 IP（502）。
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 9111 ssl;
        server_name _;

        ssl_certificate     /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;

        # 页面与 API：反代 Flask（动态解析 web 服务）
        location / {
            set $web_up "web:9111";
            proxy_pass http://$web_up;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # 禁止浏览器缓存 HTML/JS，避免群控窗等前端修复被旧缓存覆盖
            add_header Cache-Control "no-store" always;
            # Agent ensure/deploy can include cloud-device ADB startup and binary push.
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;
        }

        # 投屏 WebSocket：/ws/screen -> relay /stream（动态解析 relay 服务）
        location /ws/screen {
            set $relay_up "relay:9000";
            # 变量形式 proxy_pass 不会自动追加查询串，需显式带上 $is_args$args（含 adb_addr）
            proxy_pass http://$relay_up/stream$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # MediaMTX WebRTC WHEP：/mtx/<stream>/whep -> MediaMTX /<stream>/whep
        # 与页面同源（HTTPS 9111），避免浏览器把 http://<host>:8889 当作混合内容拦截。
        # 本地联调：UDP 推流在 192.168.10.43，因此 WHEP 也指向 .43；
        # 本地 Docker MediaMTX（mediamtx:8889 / 192.168.10.9）只用于 TCP 推流排障。
        location ~ ^/mtx/(.*)$ {
            set $mtx_up "192.168.10.43:8889";
            proxy_pass http://$mtx_up/$1$is_args$args;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            # WHEP 是长连接协商 + 持续会话，关闭缓冲避免 SDP/ICE 响应被延迟
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }
    }
}
