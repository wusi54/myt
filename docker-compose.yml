# 云phone设备管理平台 V2.1.0 —— Docker Compose 部署
# 启动:  docker compose up -d --build
# 停止:  docker compose down
# 日志:  docker compose logs -f
# 访问:  http://<宿主机IP>:9111   (投屏 relay: :9000)

x-app: &app
  build:
    context: .
    args:
      # 构建期可覆盖（默认走阿里云源）；也可在 live 环境用环境变量覆盖
      APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
      APT_SCHEME: ${APT_SCHEME:-https}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
  image: myt-manager:2.1.0
  restart: unless-stopped
  init: true

services:
  # 反向代理 + TLS 终止（对外唯一入口，HTTPS 9111）
  nginx:
    image: nginx:1.27-alpine
    container_name: myt-nginx
    restart: unless-stopped
    depends_on:
      - web
      - relay
    ports:
      - "9111:9111"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - myt-net

  # Web 服务（Flask + waitress）
  web:
    <<: *app
    container_name: myt-web
    command: ["waitress-serve", "--host=0.0.0.0", "--port=9111", "--threads=24", "app:app"]
    expose:
      - "9111"
    networks:
      - myt-net
    environment:
      PORT: "9111"
      DB_PATH: /app/data/data.db
      UPLOAD_DIR: /app/uploads
      APP_UPLOAD_DIR: /app/app_uploads
      ADB_PATH: /usr/bin/adb
      SECRET_KEY: change-me-in-production
    volumes:
      - ./data:/app/data:z                 # 数据库持久化（含 WAL）；:z 兼容宿主机 SELinux(CentOS)
      - ./uploads:/app/uploads:z           # 真机参数文件
      - ./app_uploads:/app/app_uploads:z   # APK 文件
      - ./templates:/app/templates:ro      # 前端页面（含 screen.html 的 wss 改动）热更新
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9111/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 投屏中继（WebSocket + adb screenrecord）
  relay:
    <<: *app
    container_name: myt-relay
    command: ["python", "screen_relay.py"]
    expose:
      - "9000"
    environment:
      RELAY_PORT: "9000"
      ADB_PATH: /usr/bin/adb
      SCREEN_MAX: "480"          # 投屏输出最长边（按设备分辨率等比缩放，越小越流畅）
      SCREEN_BITRATE: "150000"   # 投屏码率 bps
    volumes:
      - ./screen_relay.py:/app/screen_relay.py:ro   # 投屏中继逻辑热更新（改后 restart relay 生效）
    networks:
      - myt-net

networks:
  myt-net:
    driver: bridge
