# 云phone设备管理平台 V2.1.0 —— Docker Compose 部署
# 启动:  docker compose up -d --build
# 停止:  docker compose down
# 日志:  docker compose logs -f
# 访问:  http://<宿主机IP>:9111   (投屏 relay: :9000)

x-app: &app
  build:
    context: .
    args:
      # 构建期可覆盖（默认走阿里云源）；也可在 live 环境用环境变量覆盖
      APT_MIRROR: ${APT_MIRROR:-mirrors.aliyun.com}
      APT_SCHEME: ${APT_SCHEME:-https}
      PIP_INDEX_URL: ${PIP_INDEX_URL:-https://mirrors.aliyun.com/pypi/simple/}
      PIP_TRUSTED_HOST: ${PIP_TRUSTED_HOST:-mirrors.aliyun.com}
      HTTP_PROXY: ${HTTP_PROXY:-}
      HTTPS_PROXY: ${HTTPS_PROXY:-}
      NO_PROXY: ${NO_PROXY:-}
  image: myt-manager:2.1.0
  restart: unless-stopped
  init: true

services:
  # 反向代理 + TLS 终止（对外唯一入口，HTTPS 9111）
  # nginx.conf 由模板在容器启动时注入 MTX_WEBRTC_UP(.env) 生成，避免部署覆盖环境配置
  nginx:
    image: nginx:1.27-alpine
    container_name: myt-nginx
    restart: unless-stopped
    depends_on:
      - web
      - relay
    ports:
      - "9111:9111"
    environment:
      # 本地联调默认 192.168.10.43:8889；生产在 .env 覆盖为 113.105.100.58:8889
      - MTX_WEBRTC_UP=${MTX_WEBRTC_UP:-192.168.10.43:8889}
    volumes:
      - ./nginx.conf.template:/etc/nginx/nginx.conf.template:ro
      - ./certs:/etc/nginx/certs:ro
    networks:
      - myt-net
    # 关键：用 compose 插值(解析时)把 MTX_WEBRTC_UP 的值直接填进命令，
    # 不依赖容器内 shell 再展开环境变量(那种 $$ 写法常跨版本留原样导致 nginx unknown variable)
    command:
      - /bin/sh
      - -c
      - "sed 's|__MTX_WEBRTC_UP__|${MTX_WEBRTC_UP:-192.168.10.43:8889}|g' /etc/nginx/nginx.conf.template > /etc/nginx/nginx.conf && exec nginx -g 'daemon off;'"

  # Web 服务（Flask + waitress）
  web:
    <<: *app
    container_name: myt-web
    command: ["waitress-serve", "--host=0.0.0.0", "--port=9111", "--threads=24", "app:app"]
    expose:
      - "9111"
    networks:
      - myt-net
    environment:
      PORT: "9111"
      DB_PATH: /app/data/data.db
      UPLOAD_DIR: /app/uploads
      APP_UPLOAD_DIR: /app/app_uploads
      ADB_PATH: /usr/bin/adb
      SECRET_KEY: change-me-in-production
    volumes:
      - ./data:/app/data:z                 # 数据库持久化（含 WAL）；:z 兼容宿主机 SELinux(CentOS)
      - ./uploads:/app/uploads:z           # 真机参数文件
      - ./app_uploads:/app/app_uploads:z   # APK 文件
      - ./app.py:/app/app.py:ro            # 后端逻辑热更新（改后 restart web 生效，避免重新构建镜像）
      - ./myt_client.py:/app/myt_client.py:ro
      - ./auth.py:/app/auth.py:ro
      - ./db.py:/app/db.py:ro              # 数据访问层热更新（改表结构/迁移后 restart web 生效）
      - ./templates:/app/templates:ro      # 前端页面（含 screen.html 的 wss 改动）热更新
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:9111/healthz',timeout=3).status==200 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # 投屏中继（WebSocket：Agent 上行流 + 浏览器下行流）
  relay:
    <<: *app
    container_name: myt-relay
    command: ["python", "screen_relay.py"]
    expose:
      - "9000"
      - "9001"
    ports:
      - "9000:9000"     # WS 端口：Agent 出站连这里（/agent），浏览器经 nginx 反代（/stream）
      - "9001:9001"     # 控制 HTTP 端口
    environment:
      RELAY_PORT: "9000"
      SECRET_KEY: change-me-in-production   # 必须与 web 服务一致，relay 据此校验登录 JWT
      ADB_PATH: /usr/bin/adb
      SCREEN_MAX: "540"          # 投屏输出最长边（按设备分辨率等比缩放，越小越流畅/越省带宽）；720 会触发硬件解码偏蓝，取 480 稳妥
      SCREEN_BITRATE: "100000"   # 投屏码率 bps（下调以降低带宽与解码负载）
      RELAY_STRIP_VUI: "1"       # 剥离 scrcpy SPS 的 color VUI，避免浏览器按 BT.709 解释导致画面偏蓝
      # 方向 B：Agent 上行流（设备端 Agent 出站推帧，绕开 adb 隧道）
      RELAY_USE_AGENT: "1"       # 1=启用 Agent 模式（默认），0=回退传统 adb reverse 模式
      # 本地联调：UDP 推流必须走 192.168.10.43（10.9 只支持 TCP 推流）。
      # 生产环境可通过 .env 覆盖为公网 MediaMTX。
      MEDIAMTX_RTSP_URL: ${MEDIAMTX_RTSP_URL:-rtsp://113.105.100.58:8554}  # Agent RTSP/UDP 推流地址（生产默认；本地调试在 .env 中覆盖为 192.168.10.43）
      MEDIAMTX_WEBRTC_URL: ${MEDIAMTX_WEBRTC_URL:-http://113.105.100.58:8889}  # 浏览器 WebRTC 拉流地址（生产默认；本地调试在 .env 中覆盖）
      AGENT_TRANSPORT: ${AGENT_TRANSPORT:-tcp}   # 默认 tcp：RTP 内嵌 RTSP 连接，穿透 NAT 稳定（已验证）；同网段低延迟排障可在 .env 切 udp
      AGENT_MAX_SIZE: ${AGENT_MAX_SIZE:-720}     # Agent 采集最长边
      AGENT_BITRATE: ${AGENT_BITRATE:-1000000}   # Agent 编码码率 bps
      AGENT_KEYFRAME_INTERVAL: ${AGENT_KEYFRAME_INTERVAL:-0}  # 0=每帧关键帧，WHEP 新观众可立即解码；该机型 1/2 会被编码器钳成 10s
      AGENT_IDLE_STOP_SEC: ${AGENT_IDLE_STOP_SEC:-0}  # 0=不自动停（WHEP 观众不经过 relay，relay 无法感知订阅者）
      AGENT_TOKEN: ${AGENT_TOKEN:-}           # Agent 上行流认证密钥（生产务必设置）
      AGENT_BIN_PATH: /app/agent/myt-agent-arm64      # 推送 Agent 二进制的容器内路径
      AGENT_DEVICE_PATH: /data/local/tmp/myt-agent     # Agent 在设备上的落盘路径
    volumes:
      - ./screen_relay.py:/app/screen_relay.py:ro   # 投屏中继逻辑热更新（改后 restart relay 生效）
      - ./scrcpy:/app/scrcpy:ro                     # scrcpy-server.jar（v5.0.1，随镜像 COPY 亦可）
      - ./agent:/app/agent:ro                       # Agent 二进制（推送用）
    networks:
      - myt-net

  # MediaMTX：RTSP 推流入口 + WebRTC (WHEP) 拉流出口（MIT 开源）
  mediamtx:
    image: bluenviron/mediamtx:latest
    container_name: myt-mediamtx
    restart: unless-stopped
    network_mode: host
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro

networks:
  myt-net:
    driver: bridge
